<article class="card card--pokedexEntry h-100" [style.--bgCard]="BGCardStyle">
  <div class="frame">
    <img [src]="imgPath" class="card-img-top">
  </div>
  <div class="list p-32">
    <p class="title">{{ dexEntry.label }}</p>
    @for (pokedexSubEntry of dexEntry.pokedexVariants; track pokedexSubEntry.pokedexId) {
      <div class="cursor-pointer pb-8" (click)="handleClick(pokedexSubEntry)">
        {{ pokedexSubEntry.pokedexVariantName }}
      </div>
    }
  </div>
</article>
