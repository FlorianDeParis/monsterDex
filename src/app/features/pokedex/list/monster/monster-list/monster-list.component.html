<app-header />
<section id="monsterList">
  <div class="container-lg" *ngIf="filteredPokedex$ | async as pokedex">
    <h1 class="title">{{ pokedex.descriptions[0].description }}</h1>
    <div class="pokeList">
      @for (
        pokemon_entry of pokedex.pokemon_entries;
        track pokemon_entry.entry_number
      ) {
        <app-monster-tile [pokemon]="pokemon_entry" [idDex]="pokedexId" [generation]="pokemonGeneration" />
      }
    </div>
  </div>
</section>
